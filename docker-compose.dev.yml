services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: km_mysql_dev
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: knowledge_manager
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATE_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  # Milvus依赖 - etcd
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: km_etcd_dev
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_dev_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

  # Milvus依赖 - MinIO
  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: km_minio_dev
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_dev_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Milvus向量数据库
  milvus-standalone:
    image: milvusdb/milvus:v2.4.1
    container_name: km_milvus_dev
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_dev_data:/var/lib/milvus
    command: milvus run standalone
    depends_on:
      - milvus-etcd
      - milvus-minio
    restart: unless-stopped

volumes:
  mysql_dev_data:
  etcd_dev_data:
  minio_dev_data:
  milvus_dev_data:
